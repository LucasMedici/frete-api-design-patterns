spring.application.name=frete-api

# Banco em memória (H2)
spring.datasource.url=jdbc:h2:mem:fretedb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.open-in-view=false

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Regras de frete (lidas pelo bean singleton ConfiguracaoFrete)
frete.origem-uf=SP
frete.taxa-interestadual=1.30
